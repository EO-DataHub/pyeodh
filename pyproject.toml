[project]
name = "pyeodh"
version = "0.1.8"
description = "A lightweight Python client for EODH APIs."
authors = [{ name = "Dusan Figala", email = "dusan@oxidian.com" }]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ceda-datapoint==0.4.12",
    "lxml>=6.0.2",
    "owslib>=0.35.0",
    "pystac>=1.14.3",
    "requests-oauthlib>=2.0.0",
    "zarr>=2.18.3,<3; python_version == '3.10'",
    "zarr>=3; python_version >= '3.11'",
    "numcodecs>=0.16; python_version >= '3.11'"
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-mock",
    "pytest-watcher",
    "pytest-xdist",
    "ruff",
    "validate-pyproject",
    "pytest-cov",
    "vcrpy",
    "pytest-recording",
    "python-dotenv",
    "ipykernel",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
]
notebooks = [
    "shapely>=2.0.4",
    "matplotlib>=3.9.0",
    "pillow>=10.3.0",
    "rioxarray>=0.15.0",
    "fsspec>=2024.6.1",
    "folium>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.pyright]
include = ["pyeodh", "tests"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "FAST", # FastAPI
    "RUF",  # RUF-specific rules
    "SIM",  # Simplifications
    "B",    # Bugbear
    "ANN",  # Annotations
    "PLC",  # Pylint convention
    "PLE",  # Pylint errors
    "UP",   # pyupgrade
    "FURB", # refurb
    "PT",   # pytest
]
ignore = [
    "SIM108", # ternary operator
    "SIM103", # return bool directly
    "B008",   # function call in default argument (incompatible with FastAPI)
    "ANN401", # allow Any type in annotations (used for generic data params)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "SIM105", "PLC0415", "PT006", "PT011"]
"notebooks/**" = ["ANN", "E402", "RUF015"]
