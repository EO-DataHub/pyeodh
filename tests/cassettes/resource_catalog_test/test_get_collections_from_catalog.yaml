        sea ice products provide a 5x5 km grid of Arctic sea ice thickness (for the
        whole Arctic region and of 17 sub-regions), delivered as NetCDF files.  EOCIS
        sea ice thickness NetCDF products are generated monthly by the Centre for
        Polar Observation and Modelling (CPOM) from radar altimetry measurements taken
        from the ESA CryoSAT-2 satellite during the winter months (Oct-Apr). Sea ice
        thickness is only reliably measured from satellite radar altimetry during
        the winter months. During summer, melt ponds can form on the sea ice floes
        making it difficult for the satellite to differentiate between floes and leads,
        and hence calculate sea ice freeboard (and subsequently thickness). Measurement
        during summer months using radar altimetry is an area of active research (Landy
        et al, 2022) but is not yet operationally processed.","stac_version":"1.0.0","links":[{"rel":"items","type":"application/geo+json","href":"https://staging.eodatahub.org.uk/api/catalogue/stac/catalogs/public/catalogs/ceda-stac-catalogue/collections/eocis-arctic-sea-ice-thickness-monthly/items"},{"rel":"parent","type":"application/json","href":"https://staging.eodatahub.org.uk/api/catalogue/stac/catalogs/public/catalogs/ceda-stac-catalogue"},{"rel":"root","type":"application/json","href":"https://staging.eodatahub.org.uk/api/catalogue/stac/"},{"rel":"self","type":"application/json","href":"https://staging.eodatahub.org.uk/api/catalogue/stac/catalogs/public/catalogs/ceda-stac-catalogue/collections/eocis-arctic-sea-ice-thickness-monthly"},{"href":"https://staging.eodatahub.org.uk/api/catalogue/stac/licences/spdx/text/CC-BY-4.0.txt","rel":"license","type":"text/plain"},{"href":"https://staging.eodatahub.org.uk/api/catalogue/stac/licences/spdx/html/CC-BY-4.0.html","rel":"license","type":"text/html"}],"stac_extensions":["https://stac-extensions.github.io/datacube/v2.2.0/schema.json","https://stac-extensions.github.io/scientific/v1.0.0/schema.json","https://stac-extensions.github.io/render/v2.0.0/schema.json"],"title":"EOCIS
