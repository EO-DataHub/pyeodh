        Ice Area Fraction\",\"assets\":[\"reference_file\"],\"reference\":true,\"variable\":\"sea_ice_fraction\",\"colormap_name\":\"blues_r\",\"rescale\":[0,1]}}},{\"id\":\"eocis-soil-moisture-africa\",\"description\":\"This
        dataset contains Africa-wide soil moisture and related water balance variables
        produced within the Earth Observation Climate Information Service (EOCIS)
        project.\\n\\nThe product is derived using the JULES land surface model, forced
        with TAMSAT satellite rainfall estimates and other meteorological variables
